; Setari pentru mailurile Grind Rings Action Tracker.
; Copiaza acest fisier in "mail.ini" (in acelasi folder) si completeaza-l.
;  - mail.bat            trimite prin serverul de mail (sectiunea [smtp])
;  - outlook-mailuri.bat trimite prin Outlook-ul de pe acest calculator ([smtp] nu e necesar)

[general]
; ce actiuni intra in mail: intarziate, cu termen in urmatoarele N zile, sau urgente client
zile_inainte_termen = 2
subiect = Grind Rings - actiuni de urmarit
; link catre dashboard, pus la finalul mailului
link_dashboard = http://NUME-CALCULATOR:8092/
; copie la fiecare mail catre responsabili (gol = fara copie)
cc =
; cine primeste rezumatul cu toate actiunile (gol = fara rezumat)
rezumat_catre = sef.sectie@firma.ro

[destinatari]
; Responsabil (exact ca in tracker) = adresa de mail
Ion Popescu = ion.popescu@firma.ro
Ana Ionescu = ana.ionescu@firma.ro

[smtp]
server = smtp.firma.ro
port = 587
; starttls / ssl / niciuna
securitate = starttls
utilizator =
parola =
de_la = grind.tracker@firma.ro
