; Setari pentru mailurile Grind Rings Action Tracker.
; Copiaza acest fisier in "mail.ini" (in acelasi folder) si completeaza-l.
;   mail.bat             trimite prin serverul de mail al firmei (sectiunea [smtp])
;   outlook-mailuri.bat  trimite prin Outlook-ul de pe calculator ([smtp] nu e necesar)

[general]
; intra in mail: actiunile intarziate, cu termen in urmatoarele N zile, sau cu prioritate Urgenta
zile_inainte_termen = 2
subiect = Grind Rings - actiuni de urmarit
; link la tracker, pus la finalul mailului
link_tracker = http://NUME-CALCULATOR:8092/
; copie la fiecare mail (gol = fara)
cc =
; cine primeste rezumatul cu toate actiunile (gol = fara rezumat)
rezumat_catre = sef.sectie@firma.ro

[destinatari]
; Responsabil (exact cum e scris in tracker) = adresa de mail
Ion Popescu = ion.popescu@firma.ro
Ana Ionescu = ana.ionescu@firma.ro

[smtp]
server = smtp.firma.ro
port = 587
; starttls / ssl / niciuna
securitate = starttls
utilizator =
parola =
de_la = grind.tracker@firma.ro
