<!doctype html>
<html lang="ro" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NEXUS · Hub Servere</title>
<meta name="description" content="Centru de comandă pentru toate serverele Home Assistant: stare live, control, add-on-uri, automatizări, loguri, backup și consolă.">
<meta name="theme-color" content="#04070f">
<script>try{var t=localStorage.getItem('nexus.v1.theme');t=t?JSON.parse(t):(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" integrity="sha384-HphS8cQyN+eYiJ5PMbzShG6qZdRtvHPVLPkYb8JwMkmNgaIxrFVDhQe3jIbq3EZ2" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js" integrity="sha384-+pxiN6T7yvpryuJmE1gM9PX7yQit15auDb+ZwwvJOd/4be2Cie5/IuVXgQb/S9du" crossorigin="anonymous"></script>
<style>
:root{color-scheme:dark;--bg:#04070f;--bg2:#081022;--panel:rgba(12,20,38,.74);--panel-s:#0b1426;--panel2:rgba(24,37,66,.6);--inset:rgba(3,8,18,.5);--line:rgba(130,170,240,.13);--line2:rgba(130,170,240,.23);--text:#e9f1ff;--soft:#c2d0ea;--muted:#8498bb;--faint:#4f6185;--accent:#2ee6d6;--accent2:#9b87ff;--accent-ink:#022624;--good:#34d982;--warn:#ffbb45;--bad:#ff5c72;--info:#5aa9ff;--good-bg:rgba(52,217,130,.13);--warn-bg:rgba(255,187,69,.13);--bad-bg:rgba(255,92,114,.13);--info-bg:rgba(90,169,255,.13);--shadow:0 24px 70px rgba(0,0,0,.5);--r:16px;--r-sm:10px;--gridc:rgba(110,150,220,.055);--glow-a:rgba(46,230,214,.15);--glow-b:rgba(155,135,255,.15);--side:rgba(5,10,20,.62);--font:Inter,ui-sans-serif,"Segoe UI",system-ui,sans-serif;--display:"Space Grotesk",Inter,ui-sans-serif,sans-serif;--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace}
:root[data-theme="light"]{color-scheme:light;--bg:#edf1f8;--bg2:#e3e9f3;--panel:rgba(255,255,255,.86);--panel-s:#ffffff;--panel2:rgba(243,246,252,.95);--inset:#eef2f8;--line:rgba(25,45,85,.10);--line2:rgba(25,45,85,.18);--text:#0a1326;--soft:#22314c;--muted:#56678a;--faint:#97a4bc;--accent:#0a9d91;--accent2:#5b47e0;--accent-ink:#ffffff;--good:#12924f;--warn:#b46c00;--bad:#d3344b;--info:#1f6fd1;--good-bg:rgba(18,146,79,.1);--warn-bg:rgba(180,108,0,.1);--bad-bg:rgba(211,52,75,.09);--info-bg:rgba(31,111,209,.09);--shadow:0 12px 34px rgba(20,40,80,.10);--gridc:rgba(30,60,120,.05);--glow-a:rgba(10,157,145,.10);--glow-b:rgba(91,71,224,.09);--side:rgba(255,255,255,.7)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.bg-fx{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 520px at 6% -10%,var(--glow-a),transparent 62%),radial-gradient(820px 540px at 100% -4%,var(--glow-b),transparent 60%),linear-gradient(180deg,var(--bg),var(--bg2))}
.bg-fx::after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--gridc) 1px,transparent 1px),linear-gradient(90deg,var(--gridc) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 25%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 0%,#000 25%,transparent 75%)}
a{color:var(--accent);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:.92em}
.muted{color:var(--muted)}
.grow{flex:1}
.t-warn{color:var(--warn)}.t-bad{color:var(--bad)}.t-good{color:var(--good)}
.mdi{line-height:1}
kbd{font:500 11px var(--mono);padding:2px 6px;border-radius:6px;border:1px solid var(--line2);background:var(--inset);color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--line);background:var(--side);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);display:flex;flex-direction:column;padding:18px 14px;gap:6px;z-index:30}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 16px}
.brand-mark{width:38px;height:38px;flex:none}
.brand b{font:700 19px/1 var(--display);letter-spacing:.14em}
.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.08em;margin-top:4px;text-transform:uppercase}
.side-label{font:600 10.5px var(--font);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);padding:14px 10px 6px}
.side-srv{all:unset;box-sizing:border-box;display:grid;grid-template-columns:14px minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;cursor:pointer;border:1px solid transparent;position:relative}
.side-srv:hover{background:var(--panel2)}
.side-srv.on{background:var(--panel2);border-color:var(--line2)}
.side-srv.on::before{content:"";position:absolute;left:-14px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--c,var(--accent));box-shadow:0 0 14px var(--c,var(--accent))}
.side-srv b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-srv small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-spark{width:58px;height:20px;opacity:.9}
.sdot{width:10px;height:10px;border-radius:50%;background:var(--faint);box-shadow:0 0 0 3px color-mix(in srgb,var(--faint) 22%,transparent)}
.sdot.good{background:var(--c,var(--good));box-shadow:0 0 0 3px color-mix(in srgb,var(--c,var(--good)) 25%,transparent),0 0 12px var(--c,var(--good))}
.sdot.warn{background:var(--warn);animation:blink 1s infinite}
.sdot.bad{background:var(--bad);box-shadow:0 0 0 3px var(--bad-bg)}
.sdot.all{background:conic-gradient(var(--accent),var(--accent2),var(--warn),var(--accent));box-shadow:none}
@keyframes blink{50%{opacity:.35}}
.side-add{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;cursor:pointer;color:var(--muted);border:1px dashed var(--line2);margin-top:4px}
.side-add:hover{color:var(--text);border-color:var(--accent)}
.side-foot{margin-top:auto;padding:14px 8px 4px;color:var(--faint);font-size:11.5px;line-height:1.5}
.side-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:10px}
.side-row:hover{background:var(--panel2)}
.side-btn{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;color:var(--soft);width:100%}
.side-btn:hover{background:var(--panel2);color:var(--text)}
.side-btn .mdi{font-size:18px;color:var(--muted)}
.main-wrap{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:25;display:flex;align-items:center;gap:14px;padding:12px 26px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.crumbs{display:flex;align-items:center;gap:10px;min-width:0}
.crumbs h1{font:600 18px/1.2 var(--display);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.search-trigger{display:flex;align-items:center;gap:10px;margin-left:auto;min-width:0;width:min(420px,40vw);padding:9px 12px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);color:var(--muted);cursor:pointer;text-align:left}
.search-trigger:hover{border-color:var(--accent);color:var(--soft)}
.search-trigger span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-trigger .mdi{font-size:18px}
.top-right{display:flex;align-items:center;gap:8px}
.clock{font:500 13px var(--mono);color:var(--muted);padding:0 6px;white-space:nowrap}
.tabs{display:flex;gap:2px;padding:10px 26px 0;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:10px 14px 12px;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;font-weight:500}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.tab .mdi{font-size:17px}
.tab .badge{font:600 10.5px var(--mono);padding:1px 7px;border-radius:99px;background:var(--panel2);color:var(--soft);border:1px solid var(--line)}
.tab .badge.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.tab .badge.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
main#view{padding:22px 26px 60px;display:flex;flex-direction:column;gap:18px;outline:none;min-height:60vh}
.only-mobile{display:none}

/* ---------- primitives ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;align-items:center;gap:10px;margin:-2px 0 14px}
.panel-h h3{margin:0;font:600 15px var(--display);letter-spacing:.01em}
.panel-h .muted{font-size:12px}
.panel-h > :last-child:not(h3){margin-left:auto}
.eyebrow{font:600 10.5px var(--font);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 13px;border-radius:11px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;line-height:1.2;transition:border-color .15s,background .15s,transform .1s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn .mdi{font-size:16px}
.btn.primary{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%,var(--accent2)));border-color:transparent;color:var(--accent-ink);font-weight:600;box-shadow:0 6px 22px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent);background:var(--bad-bg)}
.btn.danger:hover{border-color:var(--bad)}
.btn.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:var(--warn-bg)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn.xs{padding:4px 8px;font-size:12px;border-radius:8px;gap:5px}
.btn.xs .mdi{font-size:14px}
.btn.busy{pointer-events:none;opacity:.6}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:11px;border:1px solid var(--line2);background:var(--panel2);color:var(--soft);cursor:pointer;flex:none}
.icon-btn:hover{border-color:var(--accent);color:var(--text)}
.icon-btn .mdi{font-size:18px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--panel2);color:var(--soft)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--info-bg);color:var(--info)}
.pill.warn::before{animation:blink 1s infinite}
.pill.plain::before{display:none}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);font-size:12px;color:var(--soft);background:var(--inset);white-space:nowrap}
.srvtag{display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 7px;border-radius:99px;font-size:11.5px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.srvtag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c);flex:none}
.demo-badge{font:700 9.5px var(--font);letter-spacing:.12em;padding:2px 6px;border-radius:6px;background:var(--warn-bg);color:var(--warn)}
.ico{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:10px;background:color-mix(in srgb,var(--c,var(--accent)) 14%,transparent);color:var(--c,var(--accent));flex:none}
.ico .mdi{font-size:18px}
.ico.lg{width:52px;height:52px;border-radius:16px}.ico.lg .mdi{font-size:28px}
.ico.dim{filter:grayscale(1);opacity:.55}
input[type=search],input[type=text],input[type=url],input[type=password],input[type=number],select,textarea{background:var(--inset);border:1px solid var(--line2);border-radius:10px;padding:8px 11px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
select{cursor:pointer}
.code{font:13px/1.55 var(--mono);background:var(--inset);border:1px solid var(--line2);border-radius:12px;padding:14px;color:var(--soft);white-space:pre-wrap;word-break:break-word;margin:0;tab-size:2}
textarea.code{width:100%;resize:vertical;min-height:220px;white-space:pre}
.code.sm{font-size:12px;padding:10px 12px;max-height:340px;overflow:auto}
.empty{display:grid;place-items:center;text-align:center;padding:56px 20px;color:var(--muted);gap:8px}
.empty .mdi{font-size:44px;color:var(--faint)}
.empty h3{margin:4px 0 0;color:var(--text);font:600 17px var(--display)}
.ok-state{display:flex;align-items:center;gap:12px;padding:18px;border-radius:12px;background:var(--good-bg);color:var(--good);font-weight:600}
.ok-state .mdi{font-size:26px}
.skeleton{height:120px;border-radius:12px;background:linear-gradient(90deg,var(--inset),var(--panel2),var(--inset));background-size:200% 100%;animation:sk 1.3s infinite linear}
@keyframes sk{to{background-position:-200% 0}}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}

/* ---------- toggles ---------- */
.tgl{all:unset;box-sizing:border-box;width:44px;height:24px;border-radius:99px;background:var(--line2);position:relative;cursor:pointer;transition:background .2s;flex:none}
.tgl i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .22s cubic-bezier(.3,1.4,.5,1)}
.tgl.on{background:var(--accent);box-shadow:0 0 16px color-mix(in srgb,var(--accent) 45%,transparent)}
.tgl.on i{transform:translateX(20px)}
.tgl:disabled{opacity:.35;cursor:not-allowed}
.tgl.busy i{animation:pulse .7s infinite alternate}
@keyframes pulse{to{transform:translateX(10px) scale(.8)}}
.ctl-grp{display:inline-flex;align-items:center;gap:4px}
.tnum{font:600 13px var(--mono);min-width:40px;text-align:center}
input.num{width:84px;padding:4px 8px;font:13px var(--mono)}
select.sel{padding:4px 8px;font-size:12.5px;max-width:150px}

/* ---------- state values ---------- */
.sv{font-weight:500;color:var(--soft)}
.sv.on{color:var(--good)}
.sv.off{color:var(--muted)}
.sv.unav{color:var(--bad)}
.sv.unk{color:var(--faint)}
.sv.num{font-family:var(--mono);color:var(--text);font-size:.95em}
.sv.hot{color:var(--warn)}
.flash{animation:flash 1.1s ease-out}
@keyframes flash{0%{background:color-mix(in srgb,var(--accent) 35%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}100%{background:transparent;box-shadow:0 0 0 0 transparent}}
[data-b^="st|"]{border-radius:6px;padding:1px 4px;margin:-1px -4px}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.kpi{position:relative;overflow:hidden;padding:16px 18px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);min-width:0}
.kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c,var(--accent)) 26%,transparent),transparent 70%)}
.kpi-l{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;font-weight:500}
.kpi-l .mdi{font-size:17px;color:var(--c,var(--accent))}
.kpi-v{font:600 30px/1.1 var(--display);margin-top:8px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi-v small{font-size:15px;color:var(--muted);font-weight:500}
.kpi-s{color:var(--muted);font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .spark{position:absolute;left:0;right:0;bottom:0;width:100%;height:34px;opacity:.75}

/* ---------- constellation ---------- */
.grid-ov{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px}
.sky-panel{padding:0;overflow:hidden;position:relative}
.sky-panel .panel-h{position:absolute;left:18px;right:18px;top:16px;z-index:2;margin:0;pointer-events:none}
.sky-wrap{height:440px;position:relative}
canvas.sky{display:block;width:100%;height:100%;cursor:default}
.sky-legend{position:absolute;left:18px;bottom:14px;display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);z-index:2;pointer-events:none}
.sky-legend span{display:inline-flex;align-items:center;gap:6px}
.sky-legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.sky-tip{position:fixed;z-index:80;pointer-events:none;min-width:200px;max-width:280px;padding:12px 14px;border-radius:12px;background:var(--panel-s);border:1px solid var(--line2);box-shadow:var(--shadow);font-size:12.5px}
.sky-tip b{font:600 14px var(--display)}
.sky-tip .row{display:flex;justify-content:space-between;gap:12px;color:var(--muted);margin-top:3px}
.sky-tip .row span:last-child{color:var(--text);font-family:var(--mono)}
.feed-panel{display:flex;flex-direction:column;max-height:440px}
.feed{list-style:none;margin:0;padding:0;overflow-y:auto;display:flex;flex-direction:column;gap:2px;flex:1;min-height:0;scrollbar-width:thin}
.fi{display:grid;grid-template-columns:auto 8px minmax(0,1fr);gap:9px;align-items:center;padding:6px 8px;border-radius:9px;font-size:12.5px;animation:fin .5s ease-out;cursor:pointer}
.fi:hover{background:var(--panel2)}
.fi time{font:11px var(--mono);color:var(--faint)}
.fi .dot{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.fi .m{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi .m b{font-weight:600}
.fi .ftr{color:var(--muted)}
@keyframes fin{from{opacity:0;transform:translateY(-6px);background:color-mix(in srgb,var(--c) 18%,transparent)}}

/* ---------- server cards ---------- */
.srv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px}
.srv-card{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .2s,border-color .2s}
.srv-card:hover{border-color:color-mix(in srgb,var(--c) 50%,var(--line));transform:translateY(-2px)}
.srv-card::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--c),transparent)}
.srv-card::after{content:"";position:absolute;right:-60px;top:-60px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 22%,transparent),transparent 70%);pointer-events:none}
.srv-card[data-status="offline"],.srv-card[data-status="auth"],.srv-card[data-status="error"]{--c:var(--bad)!important}
.sc-top{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.sc-name{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;min-width:0;font:600 17px var(--display)}
.sc-name span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-top .pill{margin-left:auto}
.sc-sub{color:var(--muted);font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:-6px}
.sc-gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px 0}
.sc-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.st-box{padding:8px 10px;border-radius:10px;background:var(--inset);border:1px solid var(--line);min-width:0}
.st-box b{display:block;font:600 16px var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.st-box small{color:var(--muted);font-size:11px;white-space:nowrap}
.st-box.bad b{color:var(--bad)}
.sc-spark{height:44px;margin:0 -18px;opacity:.9}
.sc-spark svg{width:100%;height:44px;display:block}
.sc-act{display:flex;gap:8px;align-items:center}
.sc-act .btn{flex:1}
.sc-off{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--bad-bg);color:var(--soft);font-size:13px}
.sc-off .mdi{font-size:22px;color:var(--bad)}
.sc-off.muted-box{background:var(--inset)}
.sc-off.muted-box .mdi{color:var(--muted)}

/* ---------- gauges ---------- */
.gauge{position:relative;display:grid;justify-items:center;text-align:center}
.gauge svg{width:74px;height:74px}
.gauge .g-bg{fill:none;stroke:var(--line2);stroke-width:6;stroke-linecap:round}
.gauge .g-fg{fill:none;stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 4px currentColor)}
.gauge .g-val{position:absolute;top:22px;left:0;right:0;font:600 17px var(--display);font-variant-numeric:tabular-nums}
.gauge .g-val small{font-size:10px;color:var(--muted)}
.gauge .g-lbl{font-size:11.5px;color:var(--muted);margin-top:-8px;font-weight:500}
.gauge .g-sub{font-size:10.5px;color:var(--faint);font-family:var(--mono)}
.gauge.lg svg{width:110px;height:110px}
.gauge.lg .g-val{top:34px;font-size:24px}
.gauge.lg .g-lbl{font-size:13px}

/* ---------- hero (server scope) ---------- */
.hero{display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between;position:relative;overflow:hidden;padding:22px}
.hero::after{content:"";position:absolute;left:-80px;top:-120px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 24%,transparent),transparent 70%);pointer-events:none}
.hero-main{display:flex;align-items:center;gap:20px;position:relative;z-index:1;min-width:0}
.orb{position:relative;width:78px;height:78px;flex:none;display:grid;place-items:center}
.orb span{position:absolute;inset:0;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--c) 60%,transparent);animation:orb 3s infinite ease-out}
.orb span:nth-child(2){animation-delay:1s}.orb span:nth-child(3){animation-delay:2s}
.orb b{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 70%,#fff),var(--c) 45%,color-mix(in srgb,var(--c) 40%,#000));color:#03121a;font:700 18px var(--display);box-shadow:0 0 30px color-mix(in srgb,var(--c) 60%,transparent)}
@keyframes orb{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.5);opacity:0}}
.hero h2{margin:4px 0 6px;font:600 30px/1.1 var(--display);letter-spacing:-.02em}
.hero-meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:12.5px}
.hero-actions{display:flex;flex-wrap:wrap;gap:8px;position:relative;z-index:1}
.gauge-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,1.5fr) minmax(0,1fr);gap:10px;align-items:center}
.big{font:600 30px/1.1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.gr-epm svg{width:100%;height:40px;display:block}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-family:var(--mono);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.li{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:11px;background:var(--inset);border:1px solid var(--line);min-width:0}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li.click{cursor:pointer}.li.click:hover{border-color:var(--line2)}
.li .mdi.lead{font-size:20px}
.li.bad .mdi.lead{color:var(--bad)}.li.warn .mdi.lead{color:var(--warn)}.li.info .mdi.lead{color:var(--info)}.li.muted .mdi.lead{color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:120px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:12.5px}
.bar-row .lbl{color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .n{text-align:right;font-family:var(--mono);color:var(--muted)}
.bar{height:10px;border-radius:99px;background:var(--inset);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}

/* ---------- toolbar & tables ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px}
.search{display:flex;align-items:center;gap:8px;flex:1 1 260px;min-width:0;background:var(--inset);border:1px solid var(--line2);border-radius:11px;padding:0 10px}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.search .mdi{color:var(--muted);font-size:18px}
.search input{border:0;background:transparent;box-shadow:none!important;flex:1;padding:9px 0;min-width:0}
.tb-count{color:var(--muted);font-size:12.5px;margin-left:auto;white-space:nowrap}
.dom-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:-6px}
.dchip{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--soft)}
.dchip .mdi{color:var(--c);font-size:15px}
.dchip b{font:500 11px var(--mono);color:var(--muted)}
.dchip:hover{border-color:var(--c)}
.dchip.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--text)}
.tbl-wrap{padding:6px}
.tbl{display:flex;flex-direction:column}
.tr{display:grid;align-items:center;gap:12px;padding:8px 12px;border-radius:11px;min-width:0}
.tr:not(.th){cursor:pointer}
.tr:not(.th):hover{background:var(--panel2)}
.tr.th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600;padding-top:10px;padding-bottom:10px;cursor:default}
.tr > *{min-width:0}
.tr .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .nm small{display:block;color:var(--muted);font:11.5px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .area,.tr .when{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .ctl{display:flex;justify-content:flex-end;align-items:center;gap:6px}
.ent-tbl .tr{grid-template-columns:32px minmax(180px,2.4fr) minmax(80px,1fr) minmax(110px,1.3fr) 92px 160px}
.ent-tbl.multi .tr{grid-template-columns:32px minmax(180px,2.4fr) 130px minmax(80px,1fr) minmax(110px,1.3fr) 92px 160px}
.aut-tbl .tr{grid-template-columns:32px minmax(180px,2.4fr) minmax(120px,1fr) 110px 74px 220px}
.aut-tbl.multi .tr{grid-template-columns:32px minmax(180px,2.4fr) 130px minmax(120px,1fr) 110px 74px 220px}
.more{margin:10px auto 6px;display:flex}
.stv{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- add-ons ---------- */
.addon-head{display:flex;align-items:center;gap:12px;margin:4px 2px -4px}
.addon-head h3{margin:0;font:600 16px var(--display)}
.addon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.addon{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);position:relative;overflow:hidden}
.addon[data-state="started"]::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--c);box-shadow:0 0 12px var(--c)}
.addon-top{display:flex;align-items:center;gap:12px}
.addon-top .t{flex:1;min-width:0}
.addon-top b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addon-top small{color:var(--muted);font:11.5px var(--mono)}
.addon p{margin:0;color:var(--muted);font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.meter{display:grid;grid-template-columns:38px minmax(0,1fr) 50px;gap:8px;align-items:center;font-size:11.5px;color:var(--muted)}
.meter .bar{height:6px}
.meter .n{text-align:right;font-family:var(--mono)}
.addon-act{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}

/* ---------- cameras ---------- */
.cam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.cam{margin:0;border-radius:var(--r);overflow:hidden;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}
.cam-img{all:unset;cursor:pointer;display:block;position:relative;aspect-ratio:16/9;background:#000;width:100%}
.cam-img img{width:100%;height:100%;object-fit:cover;display:block}
.cam-live{position:absolute;top:10px;left:10px;font:700 10.5px var(--mono);letter-spacing:.1em;padding:3px 8px;border-radius:6px;background:rgba(0,0,0,.55);color:#ff6b7d}
.cam-off{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:6px;color:#8a97ad;font-size:13px}
.cam-off .mdi{font-size:34px}
.cam figcaption{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:12px 14px}
.cam figcaption b{font-weight:600}

/* ---------- logs ---------- */
.log{border-radius:11px;border:1px solid var(--line);background:var(--inset);margin-bottom:6px}
.log summary{display:grid;grid-template-columns:76px 70px auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 12px;cursor:pointer;list-style:none;font-size:13px}
.log summary::-webkit-details-marker{display:none}
.log .lvl{font:700 10.5px var(--mono);letter-spacing:.06em;padding:3px 7px;border-radius:6px;text-align:center}
.lvl-ERROR .lvl,.lvl-CRITICAL .lvl{background:var(--bad-bg);color:var(--bad)}
.lvl-WARNING .lvl{background:var(--warn-bg);color:var(--warn)}
.lvl-INFO .lvl,.lvl-DEBUG .lvl{background:var(--info-bg);color:var(--info)}
.log time{font:11.5px var(--mono);color:var(--faint)}
.log .msg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log .cnt{font:600 11px var(--mono);color:var(--muted);padding:2px 7px;border-radius:99px;background:var(--panel2)}
.log-body{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--inset);border:1px solid var(--line2);gap:2px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:9px;font-size:13px;color:var(--muted);font-weight:500}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:0 1px 0 var(--line2) inset,0 4px 12px rgba(0,0,0,.15)}
.seg button b{font:600 11px var(--mono);color:var(--faint)}

/* ---------- events ---------- */
.rate-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.rate{padding:12px 14px;border-radius:12px;background:var(--inset);border:1px solid var(--line)}
.rate-h{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--muted)}
.rate-h b{color:var(--c);font-weight:600}
.rate-h span{font:600 18px var(--display);color:var(--text)}
.rate svg{width:100%;height:44px;display:block;margin-top:6px}
.evlist{list-style:none;margin:0;padding:6px;display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:92px 140px 28px minmax(0,1.4fr) minmax(0,1fr);gap:12px;align-items:center;padding:7px 10px;border-radius:10px;font-size:12.5px;animation:fin .5s ease-out;cursor:pointer}
.ev:hover{background:var(--panel2)}
.ev time{font:11.5px var(--mono);color:var(--faint)}
.ev .ico{width:26px;height:26px;border-radius:8px}.ev .ico .mdi{font-size:15px}
.ev .m{min-width:0}
.ev .m b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ev .m small{display:block;color:var(--muted);font:11px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .x{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.ev .x .mdi{font-size:13px;vertical-align:-1px;margin:0 3px}

/* ---------- console ---------- */
.con{display:flex;flex-direction:column;gap:12px}
.con-top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.con-srvs{display:flex;flex-wrap:wrap;gap:6px}
.chip-srv{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;border:1px solid var(--line2);font-size:12.5px;color:var(--muted)}
.chip-srv::before{content:"";width:8px;height:8px;border-radius:50%;border:2px solid var(--c)}
.chip-srv.on{color:var(--text);border-color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.chip-srv.on::before{background:var(--c)}
.con-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.con-help{margin:0;font-size:12.5px}
.con-out{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.con-res header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.con-res header .pill{margin-left:auto}

/* ---------- drawer & modal ---------- */
.drawer,.modal,.palette{position:fixed;inset:0;z-index:60;display:none}
.drawer.open,.modal.open,.palette.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(2,6,14,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.drawer-panel{position:absolute;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--panel-s);border-left:1px solid var(--line2);box-shadow:var(--shadow);overflow-y:auto;animation:slide .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.dw-h{display:flex;gap:14px;align-items:flex-start;padding:22px 22px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel-s);z-index:2}
.dw-t{flex:1;min-width:0}
.dw-t h3{margin:0 0 3px;font:600 20px/1.2 var(--display)}
.dw-t .mono{color:var(--muted);font-size:12px;word-break:break-all}
.dw-t .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.dw-state{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;padding:18px 22px;border-bottom:1px solid var(--line)}
.dw-big{font:600 26px/1.2 var(--display)}
.dw-ctl{margin-left:auto;display:flex;gap:6px;align-items:center}
.dw-ctl .tgl{transform:scale(1.15)}
.dw-sec{padding:16px 22px;border-bottom:1px solid var(--line)}
.dw-sec h4{margin:0 0 12px;font:600 12px var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.dw-sec h4 .btn{margin-left:auto;letter-spacing:0;text-transform:none}
.dw-cam img{width:100%;display:block;border-radius:12px;background:#000;aspect-ratio:16/9;object-fit:cover}
.dw-hist svg{width:100%;height:auto;display:block}
.attrs{display:grid;grid-template-columns:minmax(120px,auto) minmax(0,1fr);gap:6px 14px;font-size:12.5px}
.attrs dt{color:var(--muted);word-break:break-all}
.attrs dd{margin:0;font-family:var(--mono);font-size:12px;word-break:break-word;color:var(--soft)}
.dw-links{display:flex;flex-wrap:wrap;gap:8px;padding:16px 22px 26px}
.modal-box{position:absolute;left:50%;top:7vh;transform:translateX(-50%);width:min(560px,calc(100% - 28px));max-height:86vh;overflow-y:auto;background:var(--panel-s);border:1px solid var(--line2);border-radius:20px;box-shadow:var(--shadow);padding:22px;animation:pop .22s cubic-bezier(.2,.8,.2,1)}
.modal-box.wide{width:min(900px,calc(100% - 28px))}
@keyframes pop{from{opacity:0;transform:translate(-50%,10px) scale(.98)}}
.modal-h{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.modal-h h3{margin:0;font:600 20px var(--display);flex:1}
.modal-h .icon-btn{margin-left:auto}
.modal-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center;margin-top:18px}
.form{display:flex;flex-direction:column;gap:14px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted);font-weight:500}
.form label input,.form label select{color:var(--text);font-size:14px}
.form .chk{flex-direction:row;align-items:center;gap:9px;color:var(--soft);font-size:13.5px;cursor:pointer}
.form .chk input{width:17px;height:17px;accent-color:var(--accent)}
.row2{display:flex;flex-wrap:wrap;gap:18px}
.pw{display:flex;gap:6px}
.pw input{flex:1;font-family:var(--mono)!important;font-size:12.5px!important}
.sw{border:0;margin:0;padding:0;display:flex;gap:8px;flex-wrap:wrap}
.sw legend{font-size:12.5px;color:var(--muted);font-weight:500;margin-bottom:6px;padding:0}
.swatch{cursor:pointer}
.swatch input{position:absolute;opacity:0;pointer-events:none}
.swatch span{display:block;width:28px;height:28px;border-radius:50%;background:var(--c);border:3px solid var(--panel-s);box-shadow:0 0 0 1px var(--line2)}
.swatch input:checked + span{box-shadow:0 0 0 2px var(--c),0 0 16px var(--c)}
.swatch input:focus-visible + span{outline:2px solid var(--accent);outline-offset:3px}
.help{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--inset);font-size:13px;color:var(--soft)}
.help summary{cursor:pointer;font-weight:600;color:var(--text)}
.help ol,.help ul{margin:10px 0 6px;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.note{padding:10px 12px;border-radius:11px;font-size:12.5px;line-height:1.5}
.note.warn{background:var(--warn-bg);color:var(--soft);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.note.bad{background:var(--bad-bg);color:var(--soft);border:1px solid color-mix(in srgb,var(--bad) 30%,transparent)}
.note.good{background:var(--good-bg);color:var(--soft);border:1px solid color-mix(in srgb,var(--good) 30%,transparent)}
.note.info{background:var(--info-bg);color:var(--soft);border:1px solid color-mix(in srgb,var(--info) 30%,transparent)}
.note code{font-family:var(--mono);font-size:.92em}
.test-out:empty{display:none}

/* ---------- palette ---------- */
.pal-box{position:absolute;left:50%;top:10vh;transform:translateX(-50%);width:min(700px,calc(100% - 24px));background:var(--panel-s);border:1px solid var(--line2);border-radius:20px;box-shadow:0 40px 120px rgba(0,0,0,.55),0 0 0 1px color-mix(in srgb,var(--accent) 18%,transparent);overflow:hidden;animation:pop .18s cubic-bezier(.2,.8,.2,1)}
.pal-in{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.pal-in .mdi{font-size:22px;color:var(--accent)}
.pal-in input{flex:1;border:0!important;background:transparent!important;box-shadow:none!important;font-size:17px;padding:4px 0}
.pal-list{list-style:none;margin:0;padding:8px;max-height:min(60vh,520px);overflow-y:auto}
.pal-it{display:grid;grid-template-columns:32px minmax(0,1fr) auto auto auto;gap:12px;align-items:center;padding:8px 10px;border-radius:12px;cursor:pointer}
.pal-it.sel{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line2)}
.pal-it .t{min-width:0}
.pal-it .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal-it .t small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal-it kbd{opacity:0}
.pal-it.sel kbd{opacity:1}
.pal-group{font:600 10.5px var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding:10px 10px 4px}
.pal-foot{display:flex;gap:16px;padding:10px 18px;border-top:1px solid var(--line);color:var(--faint);font-size:11.5px;flex-wrap:wrap}

/* ---------- menu & toasts ---------- */
.menu{position:fixed;z-index:70;min-width:230px;padding:6px;border-radius:14px;background:var(--panel-s);border:1px solid var(--line2);box-shadow:var(--shadow);animation:pop2 .15s ease-out}
@keyframes pop2{from{opacity:0;transform:translateY(-4px)}}
.menu button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border-radius:9px;cursor:pointer;font-size:13.5px}
.menu button:hover,.menu button:focus-visible{background:var(--panel2)}
.menu button .mdi{font-size:17px;color:var(--muted)}
.menu button.danger{color:var(--bad)}.menu button.danger .mdi{color:var(--bad)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.toasts{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;max-width:min(420px,calc(100vw - 36px));padding:11px 14px;border-radius:13px;background:var(--panel-s);border:1px solid var(--line2);box-shadow:var(--shadow);font-size:13.5px;animation:tin .3s cubic-bezier(.2,.8,.2,1)}
.toast .mdi{font-size:19px}
.toast.good .mdi{color:var(--good)}.toast.bad .mdi{color:var(--bad)}.toast.warn .mdi{color:var(--warn)}.toast.info .mdi{color:var(--info)}
.toast.out{opacity:0;transform:translateY(8px);transition:.3s}
@keyframes tin{from{opacity:0;transform:translateY(12px)}}

/* ---------- welcome ---------- */
.welcome{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px;align-items:center;padding:30px 10px}
.welcome h2{font:600 clamp(30px,4.2vw,52px)/1.05 var(--display);letter-spacing:-.035em;margin:12px 0 16px}
.welcome h2 em{font-style:normal;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.welcome p.lead{color:var(--soft);font-size:16px;max-width:560px;margin:0 0 26px}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.cta .btn{padding:12px 18px;font-size:15px;border-radius:13px}
.feat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:30px}
.feat div{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.feat .mdi{font-size:22px;color:var(--accent)}
.feat b{display:block;font-weight:600;margin-bottom:2px}
.feat small{color:var(--muted);font-size:12.5px}
.w-orb{position:relative;aspect-ratio:1;max-width:460px;width:100%;margin:auto}
.w-orb svg{width:100%;height:100%;overflow:visible}

/* ---------- offline ---------- */
.offline{display:grid;justify-items:center;text-align:center;gap:10px;padding:48px 24px}
.offline .big-ico{width:84px;height:84px;border-radius:26px;display:grid;place-items:center;background:var(--bad-bg);color:var(--bad)}
.offline .big-ico .mdi{font-size:42px}
.offline.muted-box .big-ico{background:var(--inset);color:var(--muted)}
.offline h2{margin:6px 0 0;font:600 24px var(--display)}
.offline ul{text-align:left;color:var(--soft);font-size:13.5px;max-width:560px;line-height:1.6}

/* ---------- responsive ---------- */
@media (max-width:1280px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.gauge-row{grid-template-columns:repeat(4,minmax(0,1fr))}.gr-epm{grid-column:span 2}.gr-up{grid-column:span 2}}
@media (max-width:1100px){.grid-ov{grid-template-columns:1fr}.feed-panel{max-height:340px}.grid-3{grid-template-columns:1fr 1fr}.welcome{grid-template-columns:1fr}.w-orb{max-width:300px}}
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:284px;transform:translateX(-102%);transition:transform .25s ease;box-shadow:var(--shadow);background:var(--panel-s)}
  .side.open{transform:none}
  .only-mobile{display:inline-grid}
  .topbar{padding:10px 16px;gap:10px}
  .tabs{padding:8px 16px 0}
  main#view{padding:16px 16px 50px}
  .search-trigger{width:auto;flex:1}
  .search-trigger kbd,.clock{display:none}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .ent-tbl .tr,.ent-tbl.multi .tr,.aut-tbl .tr,.aut-tbl.multi .tr{grid-template-columns:32px minmax(0,1fr) auto;grid-template-areas:"i n c" "i s c";row-gap:2px}
  .tr.th{display:none}
  .tr > .ico{grid-area:i}.tr > .nm{grid-area:n}.tr > .ctl{grid-area:c}.tr > .stv{grid-area:s;font-size:12.5px}
  .tr > .area,.tr > .when,.tr > .srvc,.tr > .mode{display:none}
  .ev{grid-template-columns:62px minmax(0,1fr) auto;grid-template-areas:"t m x" "t s x"}
  .ev time{grid-area:t}.ev .m{grid-area:m}.ev .x{grid-area:x;max-width:42vw}.ev .srvtag{grid-area:s;justify-self:start}.ev .ico{display:none}
  .log summary{grid-template-columns:70px minmax(0,1fr) auto;grid-template-areas:"l m c" "l t c"}
  .log .lvl{grid-area:l}.log .msg{grid-area:m}.log time{grid-area:t}.log .cnt{grid-area:c}.log summary .srvtag{display:none}
}
@media (max-width:640px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi-v{font-size:24px}
  .sky-wrap{height:330px}
  .sky-panel .panel-h .muted,.sky-legend{display:none}
  .srv-grid,.addon-grid,.cam-grid,.con-out{grid-template-columns:minmax(0,1fr)}
  .gauge-row{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gr-epm,.gr-up{grid-column:span 1}
  .hero h2{font-size:24px}
  .hero-actions .btn{flex:1 1 auto}
  .feat{grid-template-columns:1fr}
  .search-trigger span{display:none}
  .search-trigger{flex:0 0 auto;width:auto}
  .crumbs{flex:1}
  .top-right .btn span{display:none}
  .bar-row{grid-template-columns:84px minmax(0,1fr) 44px}
  .modal-box{top:3vh;padding:18px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

      ${[0, .5, 1].map(f => `<line x1="0" x2="${W}" y1="${(8 + f * (H - 20)).toFixed(0)}" y2="${(8 + f * (H - 20)).toFixed(0)}" stroke="currentColor" stroke-opacity=".08"/>`).join('')}

const Sky = {

    cv.addEventListener('mouseleave', () => { this.hover = null; $('#tip').hidden = true; });
    cv.addEventListener('click', e => { this.move(e); if (this.hover) setScope(this.hover.srv.id); });

  mount(w) { this.ensure(); w.appendChild(this.cv); this.ro.disconnect(); this.ro.observe(w); this.resize(); this.start(); },
  resize() {

    this.colors();
  },
  colors() { this.acc = cssVar('--accent') || '#2ee6d6'; this.bad = cssVar('--bad') || '#ff5c72'; this.warn = cssVar('--warn') || '#ffbb45'; this.sprites.clear(); },
  emit(id, dir) { if (!this.raf || RM || this.parts.length > 420) return; let n = 0; for (const p of this.parts) if (p.id === id) n++; if (n > 40) return; this.parts.push({ id, dir, t0: performance.now(), d: 1100 + Math.random() * 900, k: Math.random() - .5 }); },
  start() { if (this.raf) return; const loop = t => { if (!this.cv.isConnected) { this.raf = 0; return; } this.raf = requestAnimationFrame(loop); if (document.hidden || (RM && t - this.last < 1000)) return; this.last = t; this.draw(t); }; this.raf = requestAnimationFrame(loop); },
  sprite(c, r) { const k = c + r; let s = this.sprites.get(k); if (s) return s; s = document.createElement('canvas'); s.width = s.height = r * 2; const g = s.getContext('2d'), gr = g.createRadialGradient(r, r, 0, r, r, r); gr.addColorStop(0, hexA(c, 1)); gr.addColorStop(.22, hexA(c, .55)); gr.addColorStop(1, hexA(c, 0)); g.fillStyle = gr; g.fillRect(0, 0, r * 2, r * 2); this.sprites.set(k, s); return s; },
  layout() {

  cp(nd, k) { const mx = (nd.x + this.hub.x) / 2, my = (nd.y + this.hub.y) / 2, dx = this.hub.x - nd.x, dy = this.hub.y - nd.y; const f = .12 + k * .3; return { x: mx - dy * f, y: my + dx * f }; },

function init() {
  for (const c of LS.get(K + '.servers', [])) { const s = makeServer(Object.assign({}, c, { token: c.token || SS.get(K + '.tok.' + c.id, '') })); Hub.servers.push(s); }
  if (Hub.demo) for (const d of DEMO_SERVERS) Hub.servers.push(makeServer(Object.assign({}, d)));
  if (Hub.scope !== 'all' && !S(Hub.scope)) Hub.scope = 'all';
  renderAll();
  for (const s of Hub.servers) connectServer(s);
  let n = 0;
  setInterval(() => {
    n++; const d = new Date(); $('#clock').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    if (!document.hidden) patch(n % 15 === 0);
    if (n % 20 === 0) for (const s of visible()) if (s.status === 'online' && s.hasSup) sup(s, '/core/stats').then(r => { s.coreStats = r; }).catch(() => {});
    if (n % 30 === 0 && Hub.tab === 'addons') for (const s of onlineScoped()) loadAddonDetails(s);
    if (n % 10 === 0 && Hub.tab === 'cams') refreshCams();
    if (n % 60 === 0) for (const s of visible()) if (s.status === 'online') { loadLogs(s); }
  }, 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) for (const s of visible()) if (s.status === 'offline' && s.conn) s.conn.kick(); });
}
init();
</script>
</body>
</html>
